version: '3.8'

services:
  # 1. Database - PostgreSQL with PostGIS for Camera GIS & Asset Registry
  db:
    image: postgis/postgis:15-3.3
    container_name: sentinel_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis - Ultra-fast In-Memory Cache for Watchlist Matching (< 1ms)
  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MediaMTX - Zero-Latency RTSP-to-WebRTC Video Stream Relay
  media_relay:
    image: bluenviron/mediamtx:latest
    container_name: sentinel_mediamtx
    ports:
      - "8554:8554"   # RTSP TCP Port
      - "8889:8889"   # WebRTC Port
      - "8888:8888"   # HLS Port
    volumes:
      - ./media_relay/mediamtx.yml:/mediamtx.yml

  # 4. Backend API Gateway & GIS Trajectory Engine (FastAPI)
  backend:
    build:
      context: ./backend
    container_name: sentinel_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinel:sentinel_secret_2026@db:5432/sentinel_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEDIAMTX_HOST=media_relay
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. AI Engine - YOLOv8 ANPR & Watchlist Cross-Referencing Worker
  ai_engine:
    build:
      context: ./ai_engine
    container_name: sentinel_ai_engine
    environment:
      - BACKEND_URL=http://backend:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEDIAMTX_HOST=media_relay
    depends_on:
      - backend
      - redis

  # 6. Frontend - Command Center Web Dashboard (React / WebRTC / Leaflet GIS)
  frontend:
    build:
      context: ./frontend
    container_name: sentinel_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
